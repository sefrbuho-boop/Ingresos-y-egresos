<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingresos y Egresos PANDO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #0f172a; color: #f9fafb; }
    h1 { text-align: center; }
    .card { background: #1f2937; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1rem; }
    label { display: block; margin-top: 0.5rem; font-size: 0.9rem; }
    input, select { width: 100%; padding: 0.4rem; border-radius: 0.5rem; border: none; margin-top: 0.2rem; }
    button { margin-top: 0.8rem; width: 100%; padding: 0.6rem; border-radius: 0.5rem; border: none; background: #22c55e; color: #022c22; font-weight: 600; }
    .resumen { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .resumen div { flex: 1 1 30%; background: #111827; padding: 0.6rem; border-radius: 0.5rem; text-align: center; }
    .historial-item { font-size: 0.85rem; border-bottom: 1px solid #374151; padding: 0.4rem 0; }
  </style>
</head>
<body>
  <h1>Ingresos y Egresos PANDO</h1>

  <div class="card">
    <h2>Resumen</h2>
    <div class="resumen">
      <div>
        <div>Ingresos</div>
        <strong id="ingresosTotal">S/ 0.00</strong>
      </div>
      <div>
        <div>Egresos</div>
        <strong id="egresosTotal">S/ 0.00</strong>
      </div>
      <div>
        <div>Balance</div>
        <strong id="balanceTotal">S/ 0.00</strong>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Nuevo movimiento</h2>

    <label>Propiedad
      <select id="propiedad" onchange="actualizarHabitaciones()">
        <option value="Casa Principal PANDO">Casa Principal PANDO</option>
        <option value="Local Comercial PANDO">Local Comercial PANDO</option>
        <option value="Departamento PANDO">Departamento PANDO</option>
        <option value="Edificio PANDO">Edificio PANDO</option>
      </select>
    </label>

    <label>Habitación / Piso (solo para Edificio PANDO)
      <select id="habitacion">
        <option value="Ninguna">Ninguna</option>
      </select>
    </label>

    <label>Fecha
      <input type="date" id="fecha">
    </label>

    <label>Tipo
      <select id="tipo" onchange="actualizarCategorias()">
        <option value="ingreso">Ingreso</option>
        <option value="egreso">Egreso</option>
      </select>
    </label>

    <label>Categoría
      <select id="categoria"></select>
    </label>

    <label>Descripción
      <input type="text" id="descripcion" placeholder="Ej. Recibo de luz">
    </label>

    <label>Monto (S/)
      <input type="number" step="0.01" id="monto">
    </label>

    <button onclick="registrar()">Registrar movimiento</button>
  </div>

  <div class="card">
    <h2>Historial</h2>
    <div id="historial"></div>
  </div>

  <script>
    const movimientos = [];

    const categoriasIngreso = [
      "Alquileres",
      "Sueldos",
      "Vivienda",
      "Otros ingresos"
    ];

    const categoriasEgreso = [
      "Servicios",
      "Mantenimiento",
      "Compras",
      "Impuestos",
      "Otros egresos"
    ];

    const habitacionesEdificio = [
      "Piso 1 - Habitación 101",
      "Piso 1 - Habitación 102",
      "Piso 2 - Habitación 201",
      "Piso 2 - Habitación 202",
      "Piso 3 - Habitación 301",
      "Piso 3 - Habitación 302",
      "Piso 4 - Habitación 401",
      "Piso 4 - Habitación 402",
      "Piso 5 - Habitación 501",
      "Piso 5 - Habitación 502"
    ];

    function actualizarHabitaciones() {
      const propiedad = document.getElementById('propiedad').value;
      const habSelect = document.getElementById('habitacion');
      habSelect.innerHTML = "";

      if (propiedad === "Edificio PANDO") {
        habitacionesEdificio.forEach(h => {
          const option = document.createElement("option");
          option.value = h;
          option.textContent = h;
          habSelect.appendChild(option);
        });
      } else {
        const option = document.createElement("option");
        option.value = "Ninguna";
        option.textContent = "Ninguna";
        habSelect.appendChild(option);
      }
    }

    function actualizarCategorias() {
      const tipo = document.getElementById('tipo').value;
      const categoriaSelect = document.getElementById('categoria');

      categoriaSelect.innerHTML = "";

      const lista = tipo === "ingreso" ? categoriasIngreso : categoriasEgreso;

      lista.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categoriaSelect.appendChild(option);
      });
    }

    actualizarCategorias();
    actualizarHabitaciones();

    function formato(n) {
      return 'S/ ' + n.toFixed(2);
    }

    function actualizarResumen() {
      let ingresos = 0, egresos = 0;
      movimientos.forEach(m => {
        if (m.tipo === 'ingreso') ingresos += m.monto;
        else egresos += m.monto;
      });
      document.getElementById('ingresosTotal').textContent = formato(ingresos);
      document.getElementById('egresosTotal').textContent = formato(egresos);
      document.getElementById('balanceTotal').textContent = formato(ingresos - egresos);
    }

    function pintarHistorial() {
      const cont = document.getElementById('historial');
      cont.innerHTML = '';
      movimientos.slice().reverse().forEach(m => {
        const div = document.createElement('div');
        div.className = 'historial-item';
        div.textContent =
          `${m.fecha} · ${m.tipo.toUpperCase()} · ${m.categoria} · ${formato(m.monto)} — ${m.descripcion} · ${m.propiedad} · ${m.habitacion}`;
        cont.appendChild(div);
      });
    }

    function registrar() {
      const fecha = document.getElementById('fecha').value || new Date().toISOString().slice(0,10);
      const tipo = document.getElementById('tipo').value;
      const categoria = document.getElementById('categoria').value;
      const descripcion = document.getElementById('descripcion').value || '';
      const monto = parseFloat(document.getElementById('monto').value || '0');
      const propiedad = document.getElementById('propiedad').value;
      const habitacion = document.getElementById('habitacion').value;

      if (!monto || monto <= 0) {
        alert('Ingresa un monto válido.');
        return;
      }

      movimientos.push({ fecha, tipo, categoria, descripcion, monto, propiedad, habitacion });
      actualizarResumen();
      pintarHistorial();

      document.getElementById('monto').value = '';
      document.getElementById('descripcion').value = '';
    }

    actualizarResumen();
  </script>
</body>
</html>
